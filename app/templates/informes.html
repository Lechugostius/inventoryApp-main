<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Informes - Sistema de Inventario</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/css/informes.css">
</head>
<body>
<div class="container-fluid">
 
    <!-- Header -->
    <div class="row mb-4 align-items-center">
        <div class="col-md-8">
            <h2 style="color: var(--primary-color)">
                <i class="fas fa-chart-bar me-2"></i>Informes y Estadísticas
            </h2>
        </div>
        <div class="col-md-4 text-end">
            <button class="btn btn-primary me-2" onclick="exportarPDF()">
                <i class="fas fa-file-pdf me-2"></i>Exportar PDF
            </button>
            <button class="btn btn-primary" onclick="exportarExcel()">
                <i class="fas fa-file-excel me-2"></i>Exportar Excel
            </button>
        </div>
    </div>
 
    <!-- Estadísticas generales -->
    <div class="row g-4 mb-4">
        <div class="col-md-4">
            <div class="card stat-card">
                <div class="card-header">
                    <i class="fas fa-boxes me-2"></i>Stock Total
                </div>
                <div class="card-body text-center">
                    <h3>{{ total_stock }}</h3>
                    <p class="subtitle mb-0">unidades en inventario</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card">
                <div class="card-header">
                    <i class="fas fa-sign-in-alt me-2"></i>Entradas
                </div>
                <div class="card-body text-center">
                    <h3>{{ entradas }}</h3>
                    <p class="subtitle mb-0">movimientos registrados</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card stat-card">
                <div class="card-header">
                    <i class="fas fa-sign-out-alt me-2"></i>Salidas
                </div>
                <div class="card-body text-center">
                    <h3>{{ salidas }}</h3>
                    <p class="subtitle mb-0">movimientos registrados</p>
                </div>
            </div>
        </div>
    </div>
 
    <!-- Gráficos -->
    <div class="row">
 
        <!-- Gráfico circular -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header">
                    <i class="fas fa-chart-pie me-2"></i>Items por Categoría
                </div>
                <div class="card-body">
                    <div class="chart-container">
                        <canvas id="categoriesChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
 
        <!-- Gráfico de movimientos -->
        <div class="col-md-6">
            <div class="card h-100">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span><i class="fas fa-chart-line me-2"></i>Movimientos</span>
                    <span id="chartTitle" class="small opacity-75">Cargando...</span>
                </div>
                <div class="card-body">
 
                    <!-- Filtros -->
                    <div class="filtros-section mb-3">
                        <div class="row g-2 align-items-end mb-2">
                            <div class="col-auto">
                                <label class="form-label fw-semibold mb-1" style="font-size:13px;">Agrupar por</label>
                                <select id="granSel" class="form-select form-select-sm">
                                    <option value="mes">Mes</option>
                                    <option value="semana">Semana</option>
                                    <option value="dia">Día</option>
                                </select>
                            </div>
                            <div class="col-auto">
                                <label class="form-label fw-semibold mb-1" style="font-size:13px;">Año</label>
                                <select id="yearSel" class="form-select form-select-sm"></select>
                            </div>
                            <div class="col-auto ms-auto">
                                <div class="btn-group" role="group">
                                    <button type="button" id="tabMonitor" class="btn btn-outline-primary btn-sm active">Monitoreo</button>
                                    <button type="button" id="tabCompare" class="btn btn-outline-primary btn-sm">Comparativo</button>
                                </div>
                            </div>
                            <div class="col-auto">
                                <div class="btn-group" role="group">
                                    <button type="button" id="btnLine" class="btn btn-outline-secondary btn-sm active">
                                        <i class="fas fa-chart-line"></i>
                                    </button>
                                    <button type="button" id="btnBar" class="btn btn-outline-secondary btn-sm">
                                        <i class="fas fa-chart-bar"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
 
                        <!-- Chips de período -->
                        <div id="periodChips" class="d-flex flex-wrap gap-1 mt-1"></div>
 
                        <!-- Chips de semanas -->
                        <div id="weekChipsWrap" style="display:none;" class="mt-2">
                            <div class="week-chips-label">Semana</div>
                            <div id="weekChips" class="d-flex flex-wrap gap-1"></div>
                        </div>
 
                        <!-- Comparativo -->
                        <div id="compareRow" class="mt-2 pt-2 border-top" style="display:none;">
                            <div class="row g-2">
                                <div class="col-auto">
                                    <label class="form-label fw-semibold mb-1" style="font-size:12px;">Comparar con año</label>
                                    <select id="cmpYearSel" class="form-select form-select-sm"></select>
                                </div>
                                <div class="col">
                                    <label class="form-label fw-semibold mb-1" style="font-size:12px;">Mes a comparar</label>
                                    <div id="cmpMonthChips" class="d-flex flex-wrap gap-1 mt-1"></div>
                                </div>
                            </div>
                        </div>
                    </div>
 
                    <!-- Leyenda -->
                    <div id="chartLegend" class="chart-legend"></div>
 
                    <!-- Canvas -->
                    <div class="chart-container" style="padding:0;">
                        <canvas id="movementsChart"></canvas>
                    </div>
 
                </div>
            </div>
        </div>
 
    </div>
</div>
 
<script src="/static/js/informes.js"></script>
</body>
</html>
